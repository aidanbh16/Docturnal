# Docturnal adds comments to your code and updates your docs, then opens a pull request
# for you to review. The Docturnal app starts this workflow every night at the time you
# choose in Docturnal's settings. The settings link is in each Docturnal pull request.
# Docturnal workflow version 6.
name: Docturnal

on:
  workflow_dispatch:
    inputs:
      comment-level:
        description: "How many comments to add: low, medium, heavy, or off (docs only)."
        type: choice
        options: ["low", "medium", "heavy", "off"]
        default: "medium"
      existing-code:
        description: "Existing code: gradual (comment it in small batches) or none (only new and changed code)."
        type: choice
        options: ["gradual", "none"]
        default: "gradual"
      private-minutes:
        description: "The most minutes a night Docturnal works in a private repository. Public repositories get 90."
        type: choice
        options: ["15", "30", "60", "90"]
        default: "30"

permissions:
  contents: write

# One run at a time: a run that starts while another is going waits for it, so two runs
# never push docturnal/update at once.
concurrency:
  group: docturnal
  cancel-in-progress: false

jobs:
  docturnal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Pinned to a full commit SHA, so the code that checks out your repository cannot change
      # without a new version of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: aidanbh16/Docturnal@v1
        with:
          comment-level: ${{ inputs['comment-level'] || 'medium' }}
          existing-code: ${{ inputs['existing-code'] || 'gradual' }}
          # Private repositories use the time limit from the settings; public ones 90 minutes.
          time-budget-minutes: ${{ github.event.repository.private && (inputs['private-minutes'] || '30') || '90' }}
          job-timeout-minutes: "120"
