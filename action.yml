name: Docturnal
description: Your codebase, documented overnight. Adds code comments and updates documentation using local Ollama models.
author: Docturnal
branding:
  icon: moon
  color: purple

inputs:
  comment-level:
    description: >-
      How many comments to add. One of: low (sparse, a few words each),
      medium (longer single-line comments, less sparse), heavy (a block comment
      above every function, class, and component, plus single-line comments), or
      off (documentation only).
    required: false
    default: medium
  docs-dir:
    description: Folder for generated documentation, relative to the repository root.
    required: false
    default: docs
  path:
    description: Folder to process, relative to the repository root.
    required: false
    default: .
  exclude:
    description: Glob patterns for files to skip, separated by commas or newlines.
    required: false
    default: ''
  extensions:
    description: File extensions to process, separated by commas or newlines. Leave empty to use the built-in list.
    required: false
    default: ''
  context-tokens:
    description: Context window size, in tokens, for each model call.
    required: false
    default: '8192'
  time-budget-minutes:
    description: Maximum minutes to spend on comments and documentation before the run stops and pushes what it has.
    required: false
    default: '90'
  model:
    description: The comment model. Leave as auto and Docturnal picks it.
    required: false
    default: auto
  docs-model:
    description: The documentation model. Leave as auto and Docturnal picks it.
    required: false
    default: auto
  existing-code:
    description: >-
      Existing code: "gradual" comments it in small batches after the first run documents the
      project; "none" comments only new and changed code.
    required: false
    default: gradual
  backlog-batch-size:
    description: The most existing files one batch comments.
    required: false
    default: '15'
  job-timeout-minutes:
    description: >-
      The job's timeout-minutes. Docturnal warns when time-budget-minutes leaves less than 20
      minutes before it, since a job that times out loses its work.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Cheap check first: on a night with no changes, nothing below runs.
    - name: Check for changes
      id: precheck
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
      run: node "$GITHUB_ACTION_PATH/src/precheck.js"

    - name: Select models
      id: models
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
      run: node "$GITHUB_ACTION_PATH/src/models.js"

    - name: Restore Ollama models cache
      if: steps.precheck.outputs.changed == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/docturnal-ollama-models
        key: docturnal-ollama-${{ runner.os }}-${{ steps.models.outputs.comment-model }}-${{ steps.models.outputs.docs-model }}

    # Ollama is pinned: OLLAMA_VERSION below, with each archive's SHA-256 in pins/ollama.json.
    # The cache key names the version and the checksum, so a new pin never reuses an old install.
    - name: Find the pinned Ollama release
      id: ollama
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        OLLAMA_VERSION: '0.40.11'
      run: |
        key=$(node "$GITHUB_ACTION_PATH/src/install-ollama.js" key)
        echo "Pinned Ollama release: $key"
        echo "version=$OLLAMA_VERSION" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore Ollama install cache
      if: steps.precheck.outputs.changed == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/docturnal-ollama-install
        key: docturnal-ollama-install-${{ runner.os }}-${{ runner.arch }}-${{ steps.ollama.outputs.key }}

    # Downloads the official archive from GitHub releases, checks its SHA-256 against
    # pins/ollama.json before extracting anything, and extracts the binary and the CPU
    # libraries into the runner's temporary folder: no install script, service, or sudo.
    - name: Install Ollama
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        OLLAMA_VERSION: ${{ steps.ollama.outputs.version }}
        OLLAMA_DIR: ${{ runner.temp }}/docturnal-ollama-install
      run: |
        if [ "$(uname -s)" != "Linux" ]; then
          echo "::error::Docturnal installs Ollama only on Linux x64 and arm64 runners."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/src/install-ollama.js" install

    # Ollama listens on loopback only, with its models in the cached folder.
    - name: Start Ollama
      id: ollama-server
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        OLLAMA_HOST: 127.0.0.1:11434
        OLLAMA_MODELS: ${{ runner.temp }}/docturnal-ollama-models
        OLLAMA_MAX_LOADED_MODELS: '1'
      run: |
        echo "host=$OLLAMA_HOST" >> "$GITHUB_OUTPUT"
        echo "models=$OLLAMA_MODELS" >> "$GITHUB_OUTPUT"
        mkdir -p "$OLLAMA_MODELS"
        log="$RUNNER_TEMP/docturnal-ollama.log"
        nohup ollama serve >"$log" 2>&1 &
        pid=$!
        for _ in $(seq 1 60); do
          if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then
            echo "Ollama is running (pid $pid)."
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          sleep 1
        done
        echo "::error::Ollama failed to start. Server log follows."
        cat "$log"
        exit 1

    - name: Pull models
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        OLLAMA_HOST: ${{ steps.ollama-server.outputs.host }}
        OLLAMA_MODELS: ${{ steps.ollama-server.outputs.models }}
        COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
      run: |
        ollama pull "$COMMENT_MODEL"
        verify="$COMMENT_MODEL"
        if [ "$DOCS_MODEL" != "$COMMENT_MODEL" ]; then
          ollama pull "$DOCS_MODEL"
          verify="$verify $DOCS_MODEL"
        fi
        # Each model's digest must match pins/models.json, and each of its files the digest its
        # manifest names, before any code reaches it.
        node "$GITHUB_ACTION_PATH/src/verify-models.js" $verify

    - name: Install dependencies
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      # Exactly the versions package-lock.json pins, checked against its hashes, and no install
      # scripts.
      run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts

    - name: Run Docturnal
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_CONTEXT_TOKENS: ${{ inputs.context-tokens }}
        INPUT_TIME_BUDGET_MINUTES: ${{ inputs.time-budget-minutes }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
        INPUT_SELECTED_COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        INPUT_SELECTED_DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
        INPUT_DOCS_MAY_FALLBACK: ${{ steps.models.outputs.docs-may-fallback }}
        INPUT_FALLBACK_DOCS_MODEL: ${{ steps.models.outputs.fallback-docs-model }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
        INPUT_BACKLOG_BATCH_SIZE: ${{ inputs.backlog-batch-size }}
        INPUT_JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        OLLAMA_HOST: ${{ steps.ollama-server.outputs.host }}
        # The pre-check already moved the checkout to docturnal/update, so pass the base branch.
        BASE_BRANCH: ${{ steps.precheck.outputs.base }}
      run: node "$GITHUB_ACTION_PATH/src/main.js"
