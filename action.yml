name: Docturnal
description: Your codebase, documented overnight. Adds code comments and updates documentation using local Ollama models.
author: Docturnal
branding:
  icon: moon
  color: purple

inputs:
  comment-level:
    description: >-
      How many comments to add. One of: low (sparse, a few words each),
      medium (longer single-line comments, less sparse), heavy (a block comment
      above every function, class, and component, plus single-line comments), or
      off (documentation only).
    required: false
    default: medium
  docs-dir:
    description: Folder for generated documentation, relative to the repository root.
    required: false
    default: docs
  path:
    description: Folder to process, relative to the repository root.
    required: false
    default: .
  exclude:
    description: Glob patterns for files to skip, separated by commas or newlines.
    required: false
    default: ''
  extensions:
    description: File extensions to process, separated by commas or newlines. Leave empty to use the built-in list.
    required: false
    default: ''
  context-tokens:
    description: Context window size, in tokens, for each model call.
    required: false
    default: '8192'
  time-budget-minutes:
    description: Maximum minutes to spend on comments and documentation before the run stops and pushes what it has.
    required: false
    default: '90'
  model:
    description: >-
      The comment model. Leave as auto and Docturnal picks it. With ollama-url, set it to any
      model your server can run.
    required: false
    default: auto
  docs-model:
    description: >-
      The documentation model. Leave as auto and Docturnal picks it. With ollama-url, set it to
      any model your server can run, such as a larger one on a GPU.
    required: false
    default: auto
  # Docturnal for teams. With the defaults below, the Action behaves as it does with the app.
  open-pr:
    description: >-
      Docturnal for teams: "true" makes the Action open or update the pull request itself,
      for use without the Docturnal app. Needs pull-requests write permission.
    required: false
    default: 'false'
  github-token:
    description: The token the Action uses to open the pull request when open-pr is "true".
    required: false
    default: ${{ github.token }}
  ollama-url:
    description: >-
      Docturnal for teams: the URL of an Ollama server of your own, such as
      http://ollama.internal:11434. Your source code is sent to it, so it must be inside your
      network: Docturnal refuses a host that resolves to a public address unless
      allow-public-ollama is "true". When set, Docturnal does not install or start Ollama.
    required: false
    default: ''
  allow-public-ollama:
    description: >-
      Only for ollama-url: "true" lets Docturnal send your source code to a server on a public
      address. Leave it "false" unless you are sure that server is yours.
    required: false
    default: 'false'
  pull-models:
    description: >-
      Only for ollama-url: "true" asks your server to pull missing models; "false" fails and
      names the missing model instead.
    required: false
    default: 'true'
  models-dir:
    description: >-
      Only for self-hosted runners without ollama-url: the folder that keeps the models between
      runs. Defaults to ~/.docturnal/models.
    required: false
    default: ''
  existing-code:
    description: >-
      Existing code: "gradual" comments it in small batches after the first run documents the
      project; "none" comments only new and changed code.
    required: false
    default: gradual
  backlog-batch-size:
    description: The most existing files one batch comments.
    required: false
    default: '15'
  # Parallel runs. The default, "all", does a whole run in this one job.
  mode:
    description: >-
      Which part of a run this job does: all (the default, the whole run), or for a parallel
      run, plan, work (one shard), finish, or cleanup (deletes the run's artifacts when the run
      was cancelled and finish did not run).
    required: false
    default: all
  shard:
    description: For mode work, the shard to process, from the plan's shards output.
    required: false
    default: '0'
  max-jobs:
    description: >-
      For mode plan, the most worker jobs. Empty: 8 for a public repository, 2 for a private
      one, to keep within its Actions minutes.
    required: false
    default: ''
  job-timeout-minutes:
    description: >-
      The job's timeout-minutes. Docturnal warns when time-budget-minutes leaves less than 20
      minutes before it, since a job that times out loses its work.
    required: false
    default: ''

outputs:
  has-work:
    description: For mode plan, "true" when the plan found work.
    value: ${{ steps.run.outputs.has-work }}
  shards:
    description: For mode plan, the shards for the work jobs' matrix, such as [0,1,2].
    value: ${{ steps.run.outputs.shards }}
  max-parallel:
    description: For mode plan, how many work jobs may run at once.
    value: ${{ steps.run.outputs.max-parallel }}

runs:
  using: composite
  steps:
    # Cheap check first: on a night with no changes, nothing below runs.
    - name: Check for changes
      id: precheck
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
        INPUT_MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/src/precheck.js"

    # A parallel run passes the plan, and the workers' results, between its jobs as artifacts.
    - name: Download the plan
      if: inputs.mode == 'work' || inputs.mode == 'finish'
      uses: actions/download-artifact@v8
      with:
        name: docturnal-plan
        path: ${{ runner.temp }}/docturnal-plan

    - name: Download the work results
      if: inputs.mode == 'finish'
      uses: actions/download-artifact@v8
      with:
        pattern: docturnal-shard-*
        merge-multiple: true
        path: ${{ runner.temp }}/docturnal-results

    - name: Select models
      id: models
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan'
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SHARD: ${{ inputs.shard }}
        DOCTURNAL_PLAN: ${{ runner.temp }}/docturnal-plan/plan.json
      run: node "$GITHUB_ACTION_PATH/src/models.js"

    # Caches are for GitHub-hosted runners only, so a self-hosted runner never uploads models
    # or Ollama to GitHub's cache. With ollama-url, nothing about Ollama runs on the runner.
    - name: Restore Ollama models cache
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == '' && runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/docturnal-ollama-models
        key: docturnal-ollama-${{ runner.os }}-${{ steps.models.outputs.comment-model }}-${{ steps.models.outputs.docs-model }}

    # The Ollama install is cached between runs, keyed on its version. The latest version comes
    # from GitHub's release redirect, which needs no API token; when it cannot be read, the
    # installer runs and nothing is cached.
    - name: Find the Ollama version
      id: ollama
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == '' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        version=$(curl -fsSI --max-time 20 https://github.com/ollama/ollama/releases/latest 2>/dev/null \
          | tr -d '\r' | sed -n 's|^[Ll]ocation: .*/tag/v\{0,1\}\([^/]*\)$|\1|p' | head -n 1)
        if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$'; then
          echo "Latest Ollama release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        else
          echo "Could not read the latest Ollama version, so the install is not cached this run."
        fi

    - name: Restore Ollama install cache
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == '' && runner.environment == 'github-hosted' && steps.ollama.outputs.version != ''
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/docturnal-ollama-install
        key: docturnal-ollama-install-${{ runner.os }}-${{ runner.arch }}-${{ steps.ollama.outputs.version }}

    - name: Install Ollama
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        OLLAMA_VERSION: ${{ steps.ollama.outputs.version }}
        CACHED: ${{ runner.temp }}/docturnal-ollama-install
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        # A cache hit counts only with the binary and its CPU libraries, which Ollama loads
        # from ../lib/ollama next to the binary.
        if [ -n "$OLLAMA_VERSION" ] && [ -x "$CACHED/bin/ollama" ] \
          && ls "$CACHED"/lib/ollama/libggml-cpu* >/dev/null 2>&1 \
          && "$CACHED/bin/ollama" --version >/dev/null 2>&1; then
          echo "Using the cached Ollama $OLLAMA_VERSION."
          echo "$CACHED/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        if command -v ollama >/dev/null 2>&1; then
          echo "Ollama is already installed: $(ollama --version 2>/dev/null || echo unknown version)"
        elif [ "$(uname -s)" != "Linux" ]; then
          echo "::error::Docturnal installs Ollama only on Linux x64 and arm64 runners. Install Ollama on this runner yourself, or set ollama-url."
          exit 1
        else
          # OLLAMA_VERSION pins the installer to the version the cache key names.
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_VERSION" sh
        fi
        # The installer starts a system service on port 11434. On a GitHub-hosted runner, stop it
        # so our own server can use the cached models folder. A self-hosted runner's services
        # are left alone; Docturnal starts its own server on a free port there.
        if [ "$GITHUB_HOSTED" = "true" ] && command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files ollama.service >/dev/null 2>&1; then
          sudo systemctl stop ollama || true
          sudo systemctl disable ollama || true
        fi

        # Keep what a CPU runner needs for the next run: the binary and the CPU libraries. The
        # GPU libraries are most of the download and are never used here.
        if [ -n "$OLLAMA_VERSION" ]; then
          binary=$(readlink -f "$(command -v ollama)")
          libraries="$(dirname "$(dirname "$binary")")/lib/ollama"
          rm -rf "$CACHED"
          mkdir -p "$CACHED/bin" "$CACHED/lib/ollama"
          cp "$binary" "$CACHED/bin/ollama"
          if [ -d "$libraries" ]; then
            for item in "$libraries"/*; do
              case "$(basename "$item")" in
                cuda*|rocm*|vulkan*|*cuda*) ;;
                *) cp -R "$item" "$CACHED/lib/ollama/" ;;
              esac
            done
          fi
          echo "Saved Ollama $OLLAMA_VERSION for the next run ($(du -sh "$CACHED" | cut -f1))."
        fi

    # GitHub-hosted runners use port 11434 and a models folder that is cached. Self-hosted
    # runners use a free port, so they never clash with an Ollama service already on the
    # machine, and a persistent models folder.
    - name: Start Ollama
      id: ollama-server
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
        HOSTED_MODELS: ${{ runner.temp }}/docturnal-ollama-models
        MODELS_DIR: ${{ inputs.models-dir }}
        OLLAMA_MAX_LOADED_MODELS: '1'
      run: |
        if [ "$GITHUB_HOSTED" = "true" ]; then
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$HOSTED_MODELS"
        else
          port=$(node -e "const s = require('net').createServer().listen(0, '127.0.0.1', () => { console.log(s.address().port); s.close(); })")
          export OLLAMA_HOST="127.0.0.1:$port"
          export OLLAMA_MODELS="${MODELS_DIR:-$HOME/.docturnal/models}"
          echo "Models folder: $OLLAMA_MODELS"
        fi
        echo "host=$OLLAMA_HOST" >> "$GITHUB_OUTPUT"
        mkdir -p "$OLLAMA_MODELS"
        log="$RUNNER_TEMP/docturnal-ollama.log"
        nohup ollama serve >"$log" 2>&1 &
        pid=$!
        for _ in $(seq 1 60); do
          if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then
            echo "Ollama is running (pid $pid)."
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          sleep 1
        done
        echo "::error::Ollama failed to start. Server log follows."
        cat "$log"
        exit 1

    - name: Pull models
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        OLLAMA_HOST: ${{ steps.ollama-server.outputs.host }}
        COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
        PULL_DOCS_MODEL: ${{ steps.models.outputs.pull-docs-model }}
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        # A self-hosted runner pulls only models that are not in its models folder yet, so it
        # contacts the model registry only for those. "ollama pull" checks the registry even for
        # a model it has.
        pull() {
          if [ "$GITHUB_HOSTED" != "true" ] && ollama show "$1" >/dev/null 2>&1; then
            echo "$1 is already in the models folder."
          else
            ollama pull "$1"
          fi
        }
        pull "$COMMENT_MODEL"
        # A worker with only summaries to write uses the comment model alone.
        if [ "$DOCS_MODEL" != "$COMMENT_MODEL" ] && [ "$PULL_DOCS_MODEL" != "false" ]; then
          pull "$DOCS_MODEL"
        fi

    # Docturnal for teams: checks the server in ollama-url before any code is sent to it, and
    # has it pull missing models unless pull-models is "false".
    - name: Check the Ollama server
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url != ''
      shell: bash
      env:
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_ALLOW_PUBLIC_OLLAMA: ${{ inputs.allow-public-ollama }}
        INPUT_PULL_MODELS: ${{ inputs.pull-models }}
        COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
      run: node "$GITHUB_ACTION_PATH/src/server.js"

    - name: Install dependencies
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --omit=dev --no-audit --no-fund

    - name: Run Docturnal
      id: run
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_CONTEXT_TOKENS: ${{ inputs.context-tokens }}
        INPUT_TIME_BUDGET_MINUTES: ${{ inputs.time-budget-minutes }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
        INPUT_SELECTED_COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        INPUT_SELECTED_DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
        INPUT_DOCS_MAY_FALLBACK: ${{ steps.models.outputs.docs-may-fallback }}
        INPUT_FALLBACK_DOCS_MODEL: ${{ steps.models.outputs.fallback-docs-model }}
        INPUT_OPEN_PR: ${{ inputs.open-pr }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_ALLOW_PUBLIC_OLLAMA: ${{ inputs.allow-public-ollama }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
        INPUT_BACKLOG_BATCH_SIZE: ${{ inputs.backlog-batch-size }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SHARD: ${{ inputs.shard }}
        INPUT_MAX_JOBS: ${{ inputs.max-jobs }}
        INPUT_JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        DOCTURNAL_PLAN: ${{ runner.temp }}/docturnal-plan/plan.json
        DOCTURNAL_RESULTS: ${{ runner.temp }}/docturnal-results
        OLLAMA_HOST: ${{ inputs.ollama-url || steps.ollama-server.outputs.host }}
        # The pre-check already moved the checkout to docturnal/update, so pass the base branch.
        BASE_BRANCH: ${{ steps.precheck.outputs.base }}
      run: node "$GITHUB_ACTION_PATH/src/main.js"

    # The plan and the results hold content derived from your code, including changed source
    # files: they are kept for one day at most, and the finish job deletes them when it is done.
    - name: Upload the plan
      if: inputs.mode == 'plan' && steps.run.outputs.has-work == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: docturnal-plan
        path: ${{ runner.temp }}/docturnal-plan
        retention-days: 1
        if-no-files-found: error

    - name: Upload the work results
      if: inputs.mode == 'work'
      uses: actions/upload-artifact@v7
      with:
        name: docturnal-shard-${{ inputs.shard }}
        path: ${{ runner.temp }}/docturnal-results/shard-${{ inputs.shard }}.json
        retention-days: 1
        if-no-files-found: error

    - name: Delete the run's artifacts
      if: always() && (inputs.mode == 'finish' || inputs.mode == 'cleanup')
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/artifacts.js"
