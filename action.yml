name: Docturnal
description: Your codebase, documented overnight. Adds code comments and updates documentation using local Ollama models.
author: Docturnal
branding:
  icon: moon
  color: purple

inputs:
  comment-level:
    description: >-
      How many comments to add. One of: low (sparse, a few words each),
      medium (longer single-line comments, less sparse), heavy (a block comment
      above every function, class, and component, plus single-line comments), or
      off (documentation only).
    required: false
    default: medium
  docs-dir:
    description: Folder for generated documentation, relative to the repository root.
    required: false
    default: docs
  path:
    description: Folder to process, relative to the repository root.
    required: false
    default: .
  exclude:
    description: Glob patterns for files to skip, separated by commas or newlines.
    required: false
    default: ''
  extensions:
    description: File extensions to process, separated by commas or newlines. Leave empty to use the built-in list.
    required: false
    default: ''
  context-tokens:
    description: Context window size, in tokens, for each model call.
    required: false
    default: '8192'
  time-budget-minutes:
    description: Maximum minutes to spend on comments and documentation before the run stops and pushes what it has.
    required: false
    default: '90'
  model:
    description: The comment model. Leave as auto and Docturnal picks it.
    required: false
    default: auto
  docs-model:
    description: The documentation model. Leave as auto and Docturnal picks it.
    required: false
    default: auto
  existing-code:
    description: >-
      Existing code: "gradual" comments it in small batches after the first run documents the
      project; "none" comments only new and changed code.
    required: false
    default: gradual
  backlog-batch-size:
    description: The most existing files one batch comments.
    required: false
    default: '15'
  job-timeout-minutes:
    description: >-
      The job's timeout-minutes. Docturnal warns when time-budget-minutes leaves less than 20
      minutes before it, since a job that times out loses its work.
    required: false
    default: ''
  # Internal: used for testing Docturnal. Not supported for users. With the defaults below,
  # the Action behaves as it does with the Docturnal app.
  open-pr:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. "true" makes the Action
      open or update the pull request itself.
    required: false
    default: 'false'
  github-token:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. The token for open-pr.
    required: false
    default: ${{ github.token }}
  ollama-url:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. An Ollama server on a
      private network; a host that resolves to a public address is refused unless
      allow-public-ollama is "true".
    required: false
    default: ''
  allow-public-ollama:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. "true" allows ollama-url
      to resolve to a public address.
    required: false
    default: 'false'
  pull-models:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. With ollama-url, "true"
      asks the server to pull missing models.
    required: false
    default: 'true'
  models-dir:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. On a self-hosted runner,
      the folder that keeps the models between runs.
    required: false
    default: ''
  mode:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. all (the default) does the
      whole run in one job; plan, work, finish, and cleanup are the parts of a parallel run.
    required: false
    default: all
  shard:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. For mode work, the shard
      to process.
    required: false
    default: '0'
  max-jobs:
    description: >-
      Internal: used for testing Docturnal. Not supported for users. For mode plan, the most
      work jobs.
    required: false
    default: ''

outputs:
  has-work:
    description: Internal, for mode plan. "true" when the plan found work.
    value: ${{ steps.run.outputs.has-work }}
  shards:
    description: Internal, for mode plan. The shards for the work jobs' matrix.
    value: ${{ steps.run.outputs.shards }}
  max-parallel:
    description: Internal, for mode plan. How many work jobs may run at once.
    value: ${{ steps.run.outputs.max-parallel }}

runs:
  using: composite
  steps:
    # Cheap check first: on a night with no changes, nothing below runs.
    - name: Check for changes
      id: precheck
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
        INPUT_MODE: ${{ inputs.mode }}
      run: node "$GITHUB_ACTION_PATH/src/precheck.js"

    # A parallel run passes the plan, and the workers' results, between its jobs as artifacts.
    - name: Download the plan
      if: inputs.mode == 'work' || inputs.mode == 'finish'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docturnal-plan
        path: ${{ runner.temp }}/docturnal-plan

    - name: Download the work results
      if: inputs.mode == 'finish'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: docturnal-shard-*
        merge-multiple: true
        path: ${{ runner.temp }}/docturnal-results

    - name: Select models
      id: models
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan'
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SHARD: ${{ inputs.shard }}
        DOCTURNAL_PLAN: ${{ runner.temp }}/docturnal-plan/plan.json
      run: node "$GITHUB_ACTION_PATH/src/models.js"

    # Caches are for GitHub-hosted runners only, so a self-hosted runner never uploads models
    # or Ollama to GitHub's cache. With ollama-url, nothing about Ollama runs on the runner.
    - name: Restore Ollama models cache
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == '' && runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/docturnal-ollama-models
        key: docturnal-ollama-${{ runner.os }}-${{ steps.models.outputs.comment-model }}-${{ steps.models.outputs.docs-model }}

    # Ollama is pinned: OLLAMA_VERSION below, with each archive's SHA-256 in pins/ollama.json.
    # The cache key names the version and the checksum, so a new pin never reuses an old install.
    - name: Find the pinned Ollama release
      id: ollama
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        OLLAMA_VERSION: '0.40.11'
      run: |
        key=$(node "$GITHUB_ACTION_PATH/src/install-ollama.js" key)
        echo "Pinned Ollama release: $key"
        echo "version=$OLLAMA_VERSION" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Restore Ollama install cache
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == '' && runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/docturnal-ollama-install
        key: docturnal-ollama-install-${{ runner.os }}-${{ runner.arch }}-${{ steps.ollama.outputs.key }}

    # Downloads the official archive from GitHub releases, checks its SHA-256 against
    # pins/ollama.json before extracting anything, and extracts the binary and the CPU
    # libraries into the runner's temporary folder: no install script, service, or sudo.
    - name: Install Ollama
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        OLLAMA_VERSION: ${{ steps.ollama.outputs.version }}
        OLLAMA_DIR: ${{ runner.temp }}/docturnal-ollama-install
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        # Internal testing on a self-hosted runner may use an Ollama already on its PATH.
        if [ "$GITHUB_HOSTED" != "true" ] && command -v ollama >/dev/null 2>&1; then
          echo "Using the Ollama on this runner's PATH: $(ollama --version 2>/dev/null || echo unknown version)"
          exit 0
        fi
        if [ "$(uname -s)" != "Linux" ]; then
          echo "::error::Docturnal installs Ollama only on Linux x64 and arm64 runners."
          exit 1
        fi
        node "$GITHUB_ACTION_PATH/src/install-ollama.js" install

    # GitHub-hosted runners use port 11434 and a models folder that is cached. Self-hosted
    # runners use a free port, so they never clash with an Ollama service already on the
    # machine, and a persistent models folder.
    - name: Start Ollama
      id: ollama-server
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
        HOSTED_MODELS: ${{ runner.temp }}/docturnal-ollama-models
        MODELS_DIR: ${{ inputs.models-dir }}
        OLLAMA_MAX_LOADED_MODELS: '1'
      run: |
        if [ "$GITHUB_HOSTED" = "true" ]; then
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$HOSTED_MODELS"
        else
          port=$(node -e "const s = require('net').createServer().listen(0, '127.0.0.1', () => { console.log(s.address().port); s.close(); })")
          export OLLAMA_HOST="127.0.0.1:$port"
          export OLLAMA_MODELS="${MODELS_DIR:-$HOME/.docturnal/models}"
          echo "Models folder: $OLLAMA_MODELS"
        fi
        echo "host=$OLLAMA_HOST" >> "$GITHUB_OUTPUT"
        echo "models=$OLLAMA_MODELS" >> "$GITHUB_OUTPUT"
        mkdir -p "$OLLAMA_MODELS"
        log="$RUNNER_TEMP/docturnal-ollama.log"
        nohup ollama serve >"$log" 2>&1 &
        pid=$!
        for _ in $(seq 1 60); do
          if curl -fsS "http://$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then
            echo "Ollama is running (pid $pid)."
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            break
          fi
          sleep 1
        done
        echo "::error::Ollama failed to start. Server log follows."
        cat "$log"
        exit 1

    - name: Pull models
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url == ''
      shell: bash
      env:
        OLLAMA_HOST: ${{ steps.ollama-server.outputs.host }}
        OLLAMA_MODELS: ${{ steps.ollama-server.outputs.models }}
        COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
        PULL_DOCS_MODEL: ${{ steps.models.outputs.pull-docs-model }}
        GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
      run: |
        # A self-hosted runner pulls only models that are not in its models folder yet, so it
        # contacts the model registry only for those. "ollama pull" checks the registry even for
        # a model it has.
        pull() {
          if [ "$GITHUB_HOSTED" != "true" ] && ollama show "$1" >/dev/null 2>&1; then
            echo "$1 is already in the models folder."
          else
            ollama pull "$1"
          fi
        }
        pull "$COMMENT_MODEL"
        verify="$COMMENT_MODEL"
        # A worker with only summaries to write uses the comment model alone.
        if [ "$DOCS_MODEL" != "$COMMENT_MODEL" ] && [ "$PULL_DOCS_MODEL" != "false" ]; then
          pull "$DOCS_MODEL"
          verify="$verify $DOCS_MODEL"
        fi
        # Each model's digest must match pins/models.json, and each of its files the digest its
        # manifest names, before any code reaches it.
        node "$GITHUB_ACTION_PATH/src/verify-models.js" $verify

    # Docturnal for teams: checks the server in ollama-url before any code is sent to it, and
    # has it pull missing models unless pull-models is "false".
    - name: Check the Ollama server
      if: steps.precheck.outputs.changed == 'true' && inputs.mode != 'plan' && inputs.ollama-url != ''
      shell: bash
      env:
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_ALLOW_PUBLIC_OLLAMA: ${{ inputs.allow-public-ollama }}
        INPUT_PULL_MODELS: ${{ inputs.pull-models }}
        COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
      run: node "$GITHUB_ACTION_PATH/src/server.js"

    - name: Install dependencies
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      # Exactly the versions package-lock.json pins, checked against its hashes, and no install
      # scripts.
      run: npm ci --omit=dev --no-audit --no-fund --ignore-scripts

    - name: Run Docturnal
      id: run
      if: steps.precheck.outputs.changed == 'true'
      shell: bash
      env:
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_DOCS_DIR: ${{ inputs.docs-dir }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_CONTEXT_TOKENS: ${{ inputs.context-tokens }}
        INPUT_TIME_BUDGET_MINUTES: ${{ inputs.time-budget-minutes }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_DOCS_MODEL: ${{ inputs.docs-model }}
        INPUT_SELECTED_COMMENT_MODEL: ${{ steps.models.outputs.comment-model }}
        INPUT_SELECTED_DOCS_MODEL: ${{ steps.models.outputs.docs-model }}
        INPUT_DOCS_MAY_FALLBACK: ${{ steps.models.outputs.docs-may-fallback }}
        INPUT_FALLBACK_DOCS_MODEL: ${{ steps.models.outputs.fallback-docs-model }}
        INPUT_OPEN_PR: ${{ inputs.open-pr }}
        # The token reaches this step only when it opens the pull request itself (internal).
        INPUT_GITHUB_TOKEN: ${{ inputs.open-pr == 'true' && inputs.github-token || '' }}
        INPUT_OLLAMA_URL: ${{ inputs.ollama-url }}
        INPUT_ALLOW_PUBLIC_OLLAMA: ${{ inputs.allow-public-ollama }}
        INPUT_EXISTING_CODE: ${{ inputs.existing-code }}
        INPUT_BACKLOG_BATCH_SIZE: ${{ inputs.backlog-batch-size }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SHARD: ${{ inputs.shard }}
        INPUT_MAX_JOBS: ${{ inputs.max-jobs }}
        INPUT_JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        DOCTURNAL_PLAN: ${{ runner.temp }}/docturnal-plan/plan.json
        DOCTURNAL_RESULTS: ${{ runner.temp }}/docturnal-results
        OLLAMA_HOST: ${{ inputs.ollama-url || steps.ollama-server.outputs.host }}
        # The pre-check already moved the checkout to docturnal/update, so pass the base branch.
        BASE_BRANCH: ${{ steps.precheck.outputs.base }}
      run: node "$GITHUB_ACTION_PATH/src/main.js"

    # The plan and the results hold content derived from your code, including changed source
    # files: they are kept for one day at most, and the finish job deletes them when it is done.
    - name: Upload the plan
      if: inputs.mode == 'plan' && steps.run.outputs.has-work == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docturnal-plan
        path: ${{ runner.temp }}/docturnal-plan
        retention-days: 1
        if-no-files-found: error

    - name: Upload the work results
      if: inputs.mode == 'work'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: docturnal-shard-${{ inputs.shard }}
        path: ${{ runner.temp }}/docturnal-results/shard-${{ inputs.shard }}.json
        retention-days: 1
        if-no-files-found: error

    - name: Delete the run's artifacts
      if: always() && (inputs.mode == 'finish' || inputs.mode == 'cleanup')
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/artifacts.js"
